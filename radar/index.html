*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}

<script>
(function(){
const D = JSON.parse(document.getElementById('dados').textContent);
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k === null || k === undefined || k === false) continue; e.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return e;
}
const num = n => {
  if (n === null || n === undefined || n === '' || isNaN(+n)) return '—';
  n = +n;
  const f = (v, d) => { let s = v.toFixed(d); if (s.endsWith('.0')) s = s.slice(0, -2); return s.replace('.', ','); };
  if (n >= 1e6) return f(n/1e6, n >= 1e7 ? 0 : 1) + ' mi';
  if (n >= 1e3) return f(n/1e3, n >= 1e4 ? 0 : 1) + ' mil';
  return String(Math.round(n));
};
const vezes = v => v >= 10 ? Math.round(v) + '×' : (Math.round(v*10)/10).toString().replace('.', ',') + '×';
const TIPO = {pessoa_real:'Pessoa real', personagem_provavel:'Personagem provável', nao_sei:'Não sei'};
const CLASSE = {forte:'FORTE', bom:'BOM', fraco:'FRACO', sem_regua:'SEM RÉGUA'};
const PAIS = {BR:'Brasil', Brazil:'Brasil', US:'EUA', 'United States':'EUA', GB:'Reino Unido', 'United Kingdom':'Reino Unido', PT:'Portugal', CA:'Canadá', AU:'Austrália'};
const urlVideo = id => 'https://www.youtube.com/watch?v=' + id;
const urlCanal = (id, handle) => id ? 'https://www.youtube.com/channel/' + id : (handle ? 'https://www.youtube.com/' + handle : null);
const urlBusca = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
const thumb = id => (D.thumbs && D.thumbs[id]) || 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
function semFoto(e){ const i = e.target; i.style.visibility = 'hidden'; if (i.parentNode) i.parentNode.classList.add('semfoto'); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
function copiar(txt){
  const ok = () => toast('Copiado: ' + txt);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => velho(txt, ok));
  else velho(txt, ok);
}
function velho(txt, ok){ const a = el('textarea', {style:'position:fixed;opacity:0'}); a.value = txt; document.body.append(a); a.select(); try{ document.execCommand('copy'); ok(); } catch(e){ toast('Não deu para copiar'); } a.remove(); }
function idadeTxt(it){ if (it.idade_h === undefined || it.idade_h === null) return ''; return (it.idade_aprox ? '~' : '') + Math.round(it.idade_h) + ' h'; }

$('#t-canal').textContent = 'Radar · ' + (D.canal || '');
$('#t-gerado').textContent = 'Atualizado em ' + (D.gerado || '');

// ---------- seleção de rodada
const sel = $('#sel-dia');
const dias = D.dias || [];
if (!dias.length) sel.append(el('option', {text:'nenhuma rodada ainda'}));
dias.forEach((d, i) => sel.append(el('option', {value:i, text: fmtData(d.data) + (d.arquivo && /-\d\.json$/.test(d.arquivo) ? ' (2ª)' : '')})));
function fmtData(s){ if (!s) return ''; const [a,m,d] = s.split('-'); const dt = new Date(+a, +m-1, +d); return dt.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}); }

let aba = 'videos';
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  aba = b.dataset.aba; document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b)); render();
}));
sel.addEventListener('change', render);

function render(){
  const c = $('#conteudo'); c.replaceChildren();
  if (aba === 'videos') c.append(...abaVideos(dias[+sel.value || 0]));
  if (aba === 'tendencias') c.append(...abaTendencias());
  if (aba === 'fontes') c.append(...abaFontes());
  if (aba === 'semana') c.append(...abaSemana());
  window.scrollTo(0, 0);
}

// ---------- vídeos
function abaVideos(d){
  if (!d) return [el('div', {class:'vazio', text:'Nenhuma rodada do /radar ainda. Rode /radar na pasta do canal.'})];
  const itens = d.itens || [];
  const noTema = itens.filter(i => !i.fora_do_tema);
  const fora = itens.filter(i => i.fora_do_tema);
  const mais = d.mais || [];
  const cont = c => itens.filter(i => i.classe === c).length;
  const out = [];
  const chips = el('div', {class:'chips'},
    el('span', {class:'chip', text: itens.length + ' vídeos'}),
    cont('forte') ? el('span', {class:'chip forte', text: cont('forte') + ' fortes'}) : null,
    cont('bom') ? el('span', {class:'chip bom', text: cont('bom') + ' bons'}) : null,
    cont('fraco') ? el('span', {class:'chip fraco', text: cont('fraco') + ' fracos'}) : null,
    d.contagem ? el('span', {class:'chip', text: `${d.contagem.lista ?? '—'} canais da lista · ${d.contagem.candidatos ?? '—'} candidatos · ${d.contagem.buscas ?? '—'} buscas`}) : null,
    el('span', {class:'chip', text: 'janela de ' + (d.janela_horas || 48) + ' h'}),
    d.status && d.status !== 'completo' ? el('span', {class:'chip warn', text: 'rodada ' + d.status + (d.atrasada ? ' · atrasada' : '')}) : null
  );
  out.push(el('section', {class:'resumo'},
    d.resumo ? el('p', {text: d.resumo}) : null,
    chips,
    el('details', {class:'legenda'}, el('summary', {text:'Como ler'}), el('ul', null,
      el('li', {text:'"47×" = o vídeo já tem 47 vezes as views que um vídeo normal desse canal costuma ter. Quanto maior, mais ele fugiu do padrão do canal.'}),
      el('li', {text:'FORTE, BOM ou FRACO levam em conta a idade do vídeo: 5 mil views em 10 horas pesa mais que 5 mil em 2 dias.'}),
      el('li', {text:'Pessoa real ou personagem provável é uma leitura do canal (idade, ritmo, descrição, produto no link). A métrica manda; o tipo só desempata.'}),
      el('li', {text:'"Por que deu certo" é uma leitura da embalagem (título, promessa, número, público), não uma prova.'})
    ))
  ));
  out.push(el('h2', null, 'No tema do canal', el('small', {text: noTema.length + ' vídeo(s)'})));
  out.push(noTema.length ? el('div', {class:'grade'}, noTema.map(cartao)) : el('div', {class:'vazio', text:'Nada forte no tema hoje. Vale pesquisar na mão.'}));
  if (d.da_lista && d.da_lista.length){
    out.push(el('h2', null, 'Suas fontes hoje', el('small', {text:'o que os canais da lista postaram nas 48 h'})));
    out.push(listaMais(d.da_lista));
  }
  const maisTema = mais.filter(m => !m.fora_do_tema);
  if (maisTema.length){
    out.push(el('h2', null, 'Mais no tema', el('small', {text:'também estouraram, ficaram fora dos 10'})));
    out.push(listaMais(maisTema));
  }
  const maisFora = mais.filter(m => m.fora_do_tema);
  if (fora.length || maisFora.length){
    out.push(el('h2', null, 'Estourou, mas fora do tema', el('small', {text:'só se quiser variar'})));
    if (fora.length) out.push(el('div', {class:'grade'}, fora.map(cartao)));
    if (maisFora.length) out.push(el('div', {style:'margin-top:14px'}, listaMais(maisFora)));
  }
  if (d.candidatos_novos && d.candidatos_novos.length){
    out.push(el('h2', null, 'Canais que entraram em teste hoje', el('small', {text:'candidatos: você confirma no relatório da semana'})));
    out.push(el('div', {class:'chips'}, d.candidatos_novos.map(c => el('a', {class:'chip', href: urlCanal(c.channel_id, c.handle), target:'_blank', rel:'noopener', text: c.nome + (c.tipo ? ' · ' + (TIPO[c.tipo] || c.tipo) : '')}))));
  }
  if ((d.notas && d.notas.length) || d.gasto){
    out.push(el('h2', null, 'Notas da rodada'));
    out.push(el('ul', {class:'notas'}, (d.notas || []).map(n => el('li', {text:n})),
      d.gasto ? el('li', {text: 'Gasto no NexLev: ' + Object.entries(d.gasto).map(([k,v]) => k + ' ' + v).join(' · ')}) : null));
  }
  return out;
}

function cartao(it){
  const x = it.views && it.normal ? it.views / it.normal : null;
  const cls = it.classe || 'fraco';
  const canalUrl = urlCanal(it.channel_id, it.handle);
  const pais = PAIS[it.pais] || it.pais;
  const blocos = [];
  if (it.por_que_deu_certo && it.por_que_deu_certo.length)
    blocos.push(el('div', {class:'bloco'}, el('h4', {text:'Por que deu certo'}), el('ul', null, [].concat(it.por_que_deu_certo).map(t => el('li', {text:t})))));
  if (it.por_que_vale) blocos.push(el('div', {class:'bloco'}, el('h4', {text:'Por que vale para o canal'}), el('p', {text: it.por_que_vale})));
  if (it.como_adaptar) blocos.push(el('div', {class:'bloco ideia'}, el('h4', {text:'Como daria para fazer'}), el('p', {text: it.como_adaptar})));
  if (it.parecido_com) blocos.push(el('div', {class:'alerta', text: '⚠ Parecido com vídeo seu: ' + it.parecido_com}));
  if (it.fonte){
    const f = it.fonte; const u = f.url || (f.video_id ? urlVideo(f.video_id) : null);
    blocos.push(el('div', {class:'fonte'}, el('b', {text: f.achou === false ? 'Fonte original: não achei' : 'Fonte original provável: '}),
      f.achou === false ? null : (u ? el('a', {href:u, target:'_blank', rel:'noopener', text: f.titulo || u}) : (f.titulo || '')),
      f.canal ? ' · ' + f.canal : '', f.data ? ' · ' + f.data : '', f.views ? ' · ' + num(f.views) + ' views' : '',
      f.nota ? el('div', {class:'origem', text: f.nota}) : null));
  }
  if (it.comentarios && it.comentarios.length)
    blocos.push(el('details', {class:'coment'}, el('summary', {text:'O que a plateia comenta (' + it.comentarios.length + ')'}),
      it.comentarios.map(cm => el('blockquote', null, cm.texto, cm.texto_pt && cm.texto_pt !== cm.texto ? el('span', {text: cm.texto_pt}) : null, cm.curtidas !== undefined ? el('span', {text: cm.curtidas + ' curtida(s)'}) : null))));
  return el('article', {class:'card'},
    el('a', {class:'thumb', href: urlVideo(it.video_id), target:'_blank', rel:'noopener', title:'Assistir no YouTube'},
      el('img', {src: thumb(it.video_id), alt:'', loading:'lazy', onerror: semFoto}),
      el('span', {class:'pos', text: (it.id || '').replace(/^R-\d{8}-/, '#')}),
      el('span', {class:'classe ' + cls, text: CLASSE[cls] || cls.toUpperCase()}),
      it.duracao_min ? el('span', {class:'dur', text: Math.round(it.duracao_min) + ' min'}) : null),
    el('div', {class:'corpo'},
      el('div', {class:'metrica'},
        x ? el('span', {class:'x ' + cls, text: vezes(x)}) : null,
        x ? el('span', {class:'xl', text:'o normal do canal'}) : null,
        el('span', {class:'v'}, el('b', {text: num(it.views) + ' views'}), ' em ' + idadeTxt(it), el('br'), el('span', {class:'xl', text:'normal: ' + num(it.normal)}))),
      el('h3', {class:'titulo'}, el('a', {href: urlVideo(it.video_id), target:'_blank', rel:'noopener', text: it.titulo})),
      it.titulo_pt && it.titulo_pt !== it.titulo ? el('p', {class:'pt', text: 'Em português: ' + it.titulo_pt}) : null,
      el('div', {class:'canal'},
        canalUrl ? el('a', {href: canalUrl, target:'_blank', rel:'noopener', text: it.canal}) : el('b', {text: it.canal}),
        pais ? el('span', {text: '· ' + pais}) : null,
        it.inscritos ? el('span', {text: '· ' + num(it.inscritos) + ' inscritos'}) : null,
        it.tipo ? el('span', {class:'tipo ' + it.tipo, text: TIPO[it.tipo] || it.tipo}) : null),
      blocos,
      it.origem ? el('div', {class:'origem', text: 'Achado por: ' + it.origem}) : null,
      el('div', {class:'acoes'},
        el('a', {class:'btn primario', href: urlVideo(it.video_id), target:'_blank', rel:'noopener', text:'▶ Assistir'}),
        canalUrl ? el('a', {class:'btn', href: canalUrl, target:'_blank', rel:'noopener', text:'Ver canal'}) : null,
        it.id ? el('button', {class:'btn', onclick: () => copiar('/radar transcrever ' + it.id), text:'Copiar pedido de transcrição'}) : null,
        canalUrl ? el('button', {class:'btn', onclick: () => copiar('/radar adicionar ' + canalUrl), text:'Copiar: pôr canal na lista'}) : null
      )));
}

function listaMais(arr){
  return el('div', {class:'lista'}, arr.map(m => {
    const u = m.url || (m.video_id ? urlVideo(m.video_id) : urlBusca((m.titulo || '') + ' ' + (m.canal || '')));
    const x = m.views && m.normal ? m.views / m.normal : null;
    return el('div', {class:'linha'},
      m.video_id ? el('a', {href:u, target:'_blank', rel:'noopener'}, el('img', {src: thumb(m.video_id), alt:'', loading:'lazy', onerror: semFoto})) : null,
      el('div', {class:'txt'},
        el('a', {href:u, target:'_blank', rel:'noopener'}, el('b', {text: m.titulo || '(sem título)'})),
        el('span', {text: [m.canal, m.titulo_pt && m.titulo_pt !== m.titulo ? 'Em português: ' + m.titulo_pt : null, m.nota, m.video_id ? null : 'sem link direto: abre a busca do YouTube'].filter(Boolean).join(' · ')})),
      el('span', {class:'num'}, [x ? vezes(x) : null, m.idade_h ? 'em ' + idadeTxt(m) : null].filter(Boolean).join(' '),
        m.classe ? el('span', {class:'chip ' + m.classe, style:'margin-left:8px', text: CLASSE[m.classe] || m.classe}) : null));
  }));
}

// ---------- tendências
function abaTendencias(){
  const ts = D.tendencias || [];
  if (!ts.length) return [el('div', {class:'vazio', text:'Nenhuma rodada do /tendencias ainda. Rode /tendencias na pasta do canal.'})];
  const t = ts[0];
  const out = [el('section', {class:'resumo'},
    el('p', null, el('b', {text: 'Tendências · ' + fmtData(t.data)}), t.geo ? ' · ' + (PAIS[t.geo] || t.geo) : ''),
    t.resumo ? el('p', {text: t.resumo}) : null,
    el('div', {class:'chips'}, t.gasto ? Object.entries(t.gasto).map(([k,v]) => el('span', {class:'chip', text: k + ': ' + v})) : null),
    el('p', {class:'sub', style:'margin:10px 0 0', text:'O Google Trends mede o que as pessoas buscam. É termômetro de assunto, não previsão de views.'}))];
  const bloco = (titulo, sub, arr) => {
    if (!arr || !arr.length) return;
    out.push(el('h2', null, titulo, el('small', {text: sub})));
    out.push(el('div', null, arr.map(a => el('div', {class:'trend'},
      el('b', {text: a.assunto}),
      el('div', {class:'meta', text: [a.buscas ? num(a.buscas) + ' buscas' : null, a.subida ? '+' + a.subida + '%' : null, a.desde ? 'desde ' + a.desde : null, a.categoria].filter(Boolean).join(' · ')}),
      a.por_que ? el('p', {style:'margin:0 0 4px', text: 'Por que serve: ' + a.por_que}) : null,
      a.angulo ? el('div', {class:'ideia', style:'margin:6px 0'}, el('b', {text:'Ângulo: '}), a.angulo) : null,
      a.cuidado ? el('div', {class:'alerta', text:'Cuidado: ' + (a.cuidado === true ? 'assunto sensível' : a.cuidado)}) : null,
      a.noticia ? el('a', {href: a.noticia, target:'_blank', rel:'noopener', text: a.noticia_titulo || 'notícia'}) : null))));
  };
  bloco('Para agora', 'vale por 24 a 72 h', t.agora);
  bloco('Da estação', 'semanas', t.estacao);
  if (t.subindo && t.subindo.itens && t.subindo.itens.length){
    out.push(el('h2', null, 'Subindo no tema "' + t.subindo.termo + '"', el('small', {text: t.subindo.onde || ''})));
    out.push(el('div', {class:'chips'}, t.subindo.itens.map(s => el('a', {class:'chip', href: urlBusca(s.busca), target:'_blank', rel:'noopener', text: s.busca + (s.valor ? ' · ' + s.valor : '')}))));
  }
  if (t.descartado && t.descartado.length){
    out.push(el('h2', null, 'Visto e descartado'));
    out.push(el('ul', {class:'notas'}, t.descartado.map(x => el('li', {text: x.assunto + ': ' + x.motivo}))));
  }
  return out;
}

// ---------- fontes
function abaFontes(){
  const f = D.fontes || {};
  const card = c => el('div', {class:'fonte-card'},
    el('b', null, el('a', {href: urlCanal(c.id, c.handle), target:'_blank', rel:'noopener', text: c.nome})),
    el('div', {class:'canal'}, c.tipo ? el('span', {class:'tipo ' + c.tipo, text: TIPO[c.tipo] || c.tipo}) : null, c.pais ? el('span', {text: PAIS[c.pais] || c.pais}) : null, c.entrou ? el('span', {text:'desde ' + String(c.entrou).split('-').reverse().join('/')}) : null),
    c.motivo || c.origem ? el('p', {text: c.motivo || c.origem}) : null);
  return [
    el('h2', null, 'Lista de fontes', el('small', {text:'conferida em toda rodada, sempre primeiro'})),
    (f.lista || []).length ? el('div', {class:'fontes-grade'}, f.lista.map(card)) : el('div', {class:'vazio', text:'Lista vazia. Use /radar adicionar <link>.'}),
    el('h2', null, 'Candidatos', el('small', {text:'em teste; no relatório da semana você decide quem entra'})),
    (f.candidatos || []).length ? el('div', {class:'fontes-grade'}, f.candidatos.map(card)) : el('div', {class:'vazio', text:'Nenhum candidato agora.'})
  ];
}

// ---------- semana
function abaSemana(){
  const ss = D.semanas || [];
  if (!ss.length) return [el('div', {class:'vazio', text:'Nenhum relatório da semana ainda. Ele sai no dia marcado no config (ou com /radar semana).'})];
  const s = ss[0];
  const out = [el('section', {class:'resumo'}, el('p', null, el('b', {text:'Relatório da semana · ' + fmtData(s.data)})), s.resumo ? el('p', {text: s.resumo}) : null)];
  if (s.candidatos && s.candidatos.length){
    out.push(el('h2', {text:'Candidatos'}));
    out.push(el('div', {class:'fontes-grade'}, s.candidatos.map(c => el('div', {class:'fonte-card'},
      el('b', null, el('a', {href: urlCanal(c.channel_id, c.handle), target:'_blank', rel:'noopener', text: c.nome})),
      el('div', {class:'canal'}, c.tipo ? el('span', {class:'tipo ' + c.tipo, text: TIPO[c.tipo] || c.tipo}) : null, c.recomendacao ? el('span', {class:'chip ' + (c.recomendacao === 'entra' ? 'forte' : c.recomendacao === 'sai' ? 'fraco' : 'bom'), text: c.recomendacao}) : null),
      el('p', {text: [c.fortes !== undefined ? c.fortes + ' forte(s)' : null, c.bons !== undefined ? c.bons + ' bom(ns)' : null, c.melhor ? 'melhor: ' + c.melhor : null].filter(Boolean).join(' · ')}),
      c.porque ? el('p', {text: c.porque}) : null,
      c.channel_id ? el('button', {class:'btn', onclick: () => copiar('/radar adicionar ' + urlCanal(c.channel_id)), text:'Copiar: pôr na lista'}) : null))));
  }
  if (s.canal_resumo){ out.push(el('h2', {text:'Como o canal está'})); out.push(el('p', {text: s.canal_resumo})); }
  return out;
}

render();
})();
</script>

</html>
